repos:
  - repo: local
    hooks:
      - id: architecture-isolation
        name: Architecture Commit Isolation
        entry: sdlc/hooks/check-architecture-isolation.sh
        language: script
        stages: [commit]
        pass_filenames: false
        always_run: true

      - id: architecture-adr-format
        name: Architecture ADR Format
        entry: sdlc/hooks/check-adr-format.sh
        language: script
        stages: [commit-msg]
        pass_filenames: true

      - id: architecture-branch-consistency
        name: Architecture Branch Consistency
        entry: sdlc/hooks/check-branch-consistency.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
