# CLI Development Template

name: cli-development
description: Command-line tools with argument parsing and testing
category: tools

workflow_mode: traditional
output_style: sdlc-rules

test_commands:
  rust:
    unit: "cargo test"
    integration: "cargo test --test '*'"
  go:
    unit: "go test ./..."
  python:
    unit: "pytest"

directory_structure:
  - src/
  - src/commands/
  - src/args/
  - tests/
  - tests/integration/

recommended_tools:
  - gh CLI
  - cargo (Rust) / go / python
  - shellcheck (for bash integration)

example_test: |
  // Example: CLI argument parsing
  #[test]
  fn parses_add_command_with_numbers() {
      let args = vec!["calc", "add", "2", "3"];
      let cmd = parse_args(args).unwrap();
      assert_eq!(cmd, Command::Add { a: 2, b: 3 });
  }

setup_steps:
  - "Install language toolchain"
  - "Run /sdlc:setup --template=cli-development"
