# Library Development Template

name: library-development
description: Reusable libraries with comprehensive testing and documentation
category: library

workflow_mode: traditional
output_style: sdlc-rules

test_commands:
  rust:
    unit: "cargo test"
    doc: "cargo test --doc"
  typescript:
    unit: "npm test"
  python:
    unit: "pytest"

directory_structure:
  - src/
  - tests/
  - examples/
  - docs/

recommended_tools:
  - gh CLI
  - documentation generator (rustdoc, jsdoc, sphinx)
  - benchmarking tools

example_test: |
  // Example: Public API testing
  #[test]
  fn creates_default_instance() {
      let config = Config::default();
      assert_eq!(config.timeout, Duration::from_secs(30));
  }

  #[test]
  fn validates_input_constraints() {
      let result = Config::new().timeout(0);
      assert!(result.is_err());
  }

setup_steps:
  - "Install language toolchain"
  - "Configure documentation generation"
  - "Run /sdlc:setup --template=library-development"
