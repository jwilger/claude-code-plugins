# API Development Template

name: api-development
description: REST/GraphQL API projects with test-first development
category: backend

# Pre-configured settings
workflow_mode: traditional  # Event Modeling optional
output_style: sdlc-rules

# Test commands by language
test_commands:
  rust:
    unit: "cargo test"
    integration: "cargo test --test '*'"
  typescript:
    unit: "npm test"
    integration: "npm run test:integration"
  python:
    unit: "pytest tests/unit"
    integration: "pytest tests/integration"
  go:
    unit: "go test ./..."
    integration: "go test -tags=integration ./..."

# Recommended structure
directory_structure:
  - src/
  - src/handlers/
  - src/models/
  - src/services/
  - tests/
  - tests/unit/
  - tests/integration/

# Common tools
recommended_tools:
  - gh CLI (GitHub integration)
  - curl (API testing)
  - jq (JSON parsing)
  - httpie (human-friendly HTTP)

# Example first test
example_test: |
  // Example: User registration endpoint
  #[test]
  fn registers_new_user_with_valid_email() {
      let app = TestApp::new();
      let response = app.post_user(json!({
          "email": "test@example.com",
          "password": "secure123"
      }));
      assert_eq!(response.status(), 201);
  }

# Setup instructions
setup_steps:
  - "Install gh CLI: https://cli.github.com/"
  - "Configure test database (if needed)"
  - "Run /sdlc:setup with this template"
  - "Start with /sdlc:work"
