# UI Development Template

name: ui-development
description: React/Vue/Svelte component development with testing
category: frontend

workflow_mode: traditional
output_style: sdlc-rules

test_commands:
  react:
    unit: "npm test"
    component: "npm run test:component"
  vue:
    unit: "npm test"
    component: "npm run test:component"
  svelte:
    unit: "npm test"
    component: "npm run test:component"

directory_structure:
  - src/
  - src/components/
  - src/components/atoms/
  - src/components/molecules/
  - src/components/organisms/
  - src/hooks/
  - src/utils/
  - tests/
  - tests/components/

recommended_tools:
  - gh CLI
  - browser DevTools
  - React DevTools / Vue DevTools

example_test: |
  // Example: Button component
  test('renders button with text', () => {
    render(<Button>Click me</Button>);
    expect(screen.getByText('Click me')).toBeInTheDocument();
  });

  test('calls onClick when clicked', () => {
    const handleClick = jest.fn();
    render(<Button onClick={handleClick}>Click</Button>);
    fireEvent.click(screen.getByText('Click'));
    expect(handleClick).toHaveBeenCalledTimes(1);
  });

setup_steps:
  - "Install gh CLI"
  - "Ensure test framework configured (Jest, Vitest, etc.)"
  - "Run /sdlc:setup --template=ui-development"
