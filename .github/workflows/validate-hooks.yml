name: Validate Hook Formats

on:
  push:
    branches: [ main ]
    paths:
      - 'sdlc/.claude-plugin/hooks/**'
      - 'sdlc/agents/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdlc/.claude-plugin/hooks/**'
      - 'sdlc/agents/**'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Validate hook return formats
      run: |
        cd sdlc/.claude-plugin/hooks
        chmod +x validate-formats.sh
        ./validate-formats.sh

    - name: Check for bash syntax errors
      run: |
        cd sdlc/.claude-plugin/hooks
        for file in *.sh; do
          if [[ -f "$file" ]]; then
            bash -n "$file" || {
              echo "❌ Syntax error in $file"
              exit 1
            }
          fi
        done

    - name: Check for required jq dependency
      run: |
        which jq || {
          echo "⚠️  Warning: jq not found - some hooks may fail"
        }
